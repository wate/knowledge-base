# =========================
# ナレッジベース 全体設定（サンプル）
# =========================
# 設定優先順位: CLI引数 > config.yml > 環境変数 > デフォルト値
#
# プロジェクトルートに .knowledge-base.yml として配置することを想定。
# パスはプロジェクトルートからの相対パスで記述する。

# ----------
# ソース設定(取得元の一覧)
# ----------
sources:
  - docs # ショートハンド: ローカルディレクトリ
  # - http://example.com/         # ショートハンド: Web URL
  # - source: http://example.com/
  #   type: redmine
  #   auth:
  #     api_key: xxxxx
  # ソース単位の除外パターン指定例
  - path: knowledge-base/external/cakephp
    exclude_patterns:
      - '**/404.md'
      - '**/contents.md'
      - '**/epub-contents.md'
      - '**/pdf-contents.md'

# ----------
# ローカルファイル↔原本URLマッピング
# ----------
# Gitでクローンしたドキュメントと公式URLの対応関係を定義する。
# 検索結果に原本URL（📎）が表示され、ワンクリックで公式サイトを確認できる。
source_mappings:
  - match: 'knowledge-base/external/cakephp/**'
    url_template: 'https://book.cakephp.org/5/en/{{ path }}'
    replace_ext:
      .md: .html

# ----------
# ローカルソース設定(syncのディレクトリスキャン用)
# ----------
source_local:
  exclude_patterns:
    - node_modules/**
    - .git/**
    - vendor/**

# ----------
# パスの基準とキャッシュ
# ----------
# 設定内の相対パスは base_dir 基準で解決する(既定: 実行ディレクトリ)
# base_dir: .
# 辞書とモデルのキャッシュのルート(既定: knowledge-base.mjs と同じ階層の .cache)
# 辞書は cache_dir/dict、モデルは cache_dir/models に置かれる
# cache_dir: .cache

# ----------
# データベース
# ----------
database:
  # DBファイルのパス（プロジェクトルートからの相対パス）
  path: knowledge-base.duckdb

# ----------
# Lindera辞書
# ----------
dictionary:
  # 辞書種別(ipadic / unidic / ko-dic...)。既定は ipadic
  type: ipadic
  # システム辞書ディレクトリ(既定: cache_dir/dict/system。変則配置のときだけ指定する)
  # system_dir: path/to/dict
  # ユーザー辞書ファイル(既定: cache_dir/dict/user/user-dict.bin)
  # user_dict: path/to/user-dict.bin

# ----------
# ドキュメント取り込み
# ----------
ingest:
  # チャプター分割に使う最も深い見出しレベル(h4以降は親章へ含める)
  min_heading_level: 3

# ----------
# ベクトル化設定
# ----------
embedding:
  model: intfloat/multilingual-e5-small
  dimensions: 384
  batch_size: 32
  # モデルキャッシュ(既定: cache_dir/models。変則配置のときだけ指定する)
  # cache_dir: path/to/models

# ----------
# 検索スコア係数（合計が1.0になるように設定）
# ----------
search:
  # 2段階検索の第1段階で絞り込む文書数(--topの件数とは独立)
  top_n_documents: 20

  # ベクトル検索スコアの内訳(cosineとpagerankは検索候補内でmin-max正規化してから重み付けする)
  weights:
    cosine: 0.65
    pagerank: 0.05
    heading: 0.2
    position: 0.1

  # ハイブリッド検索時の合算係数
  hybrid_weights:
    vector: 0.7 # ベクトルスコア（上記 weights の合算値）
    bm25: 0.3 # BM25スコア

# ----------
# 見出しレベルごとの重み
# ----------
heading_weights:
  1: 9.0
  2: 6.0
  3: 3.0
  4: 2.0
  5: 1.5
  6: 1.0

# ----------
# 未知語検出（Phase 2以降で拡張）
# ----------
unknown_word_detection:
  # 解析対象ディレクトリ（未指定時は sources の local 型エントリを参照）
  source_dirs:
  # ノイズフィルタ（Phase 2 で実装）
  filters:
