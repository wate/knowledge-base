# =========================
# ナレッジベース 全体設定（サンプル）
# =========================
# 設定優先順位: CLI引数 > config.yml > 環境変数 > デフォルト値
#
# プロジェクトルートに .knowledge-base.yml として配置することを想定。
# パスはプロジェクトルートからの相対パスで記述する。

# ----------
# ソース設定(取得元の一覧)
# ----------
sources:
  - docs # ショートハンド: ローカルディレクトリ
  # - http://example.com/         # ショートハンド: Web URL
  # - source: http://example.com/
  #   type: redmine
  #   auth:
  #     api_key: xxxxx

# ----------
# ローカルソース設定(collect.mjsのディレクトリスキャン用)
# ----------
source_local:
  exclude_patterns:
    - node_modules/**
    - .git/**
    - vendor/**

# ----------
# データベース
# ----------
database:
  # DBファイルのパス（プロジェクトルートからの相対パス）
  path: knowledge-base.duckdb

# ----------
# Lindera辞書
# ----------
dictionary:
  # 辞書種別(ipadic / unidic / ko-dic...)
  type: ipadic
  # システム辞書ディレクトリ（固定パス。type はこのディレクトリに入れる辞書の種別）
  system_dir: dict/system
  # ユーザー辞書ファイル（存在しない場合は読み込まない）
  user_dict: dict/user/user-dict.bin

# ----------
# ドキュメント取り込み
# ----------
ingest:
  # チャプター分割の最小見出しレベル
  min_heading_level: 3
  # 除外ディレクトリ/ファイルのパターン（glob）
  exclude_patterns:
    - node_modules/**
    - .git/**
    - vendor/**

# ----------
# ベクトル化設定
# ----------
embedding:
  model: intfloat/multilingual-e5-small
  dimensions: 384
  batch_size: 32
  cache_dir: tmp/models

# ----------
# 章立て設定
# ----------
chapter:
  min_heading_level: 3

# ----------
# 検索スコア係数（合計が1.0になるように設定）
# ----------
search:
  # 2段階検索の第1段階で取得する上位N件
  top_n_documents: 10

  # ベクトル検索スコアの内訳
  weights:
    cosine: 0.5
    pagerank: 0.2
    heading: 0.2
    position: 0.1

  # ハイブリッド検索時の合算係数
  hybrid_weights:
    vector: 0.7 # ベクトルスコア（上記 weights の合算値）
    bm25: 0.3 # BM25スコア

# ----------
# 見出しレベルごとの重み
# ----------
heading_weights:
  1: 9.0
  2: 6.0
  3: 3.0
  4: 2.0
  5: 1.5
  6: 1.0

# ----------
# 未知語検出（Phase 2以降で拡張）
# ----------
unknown_word_detection:
  # 解析対象ディレクトリ（未指定時は sources の local 型エントリを参照）
  source_dirs:
  # ノイズフィルタ（Phase 2 で実装）
  filters:

# ----------
# 変換後処理パイプライン（Phase 2 以降で実装）
# ----------
pipeline:
  # エラー時ポリシー（ステージごとのデフォルト）
  # abort: 中断、skip: スキップ。未指定時は skip
  on_error:
    post_extract: abort
    post_convert: skip
  # 抽出後・Markdown変換前の処理（設定スキーマのみ。実装は別タスク）
  post_extract:
  # Markdown変換後に実行。上から順に直列処理。
  # only を指定すると該当ソース種別のみ実行。
  post_convert:
    # - script: lib/pipeline/example.mjs
