# ナレッジベース 検索設定
# =========================
# このファイルの値を変更すると検索スコアの計算に反映されます。

# ベクトル化設定
embedding:
  model: intfloat/multilingual-e5-small
  dimensions: 384
  batch_size: 32

# 章立て設定
chapter:
  min_heading_level: 3

# 検索スコア係数（合計が1.0になるように設定）
search:
  # 2段階検索の第1段階で取得する上位N件
  top_n_documents: 10

  # ベクトル検索スコアの内訳
  weights:
    cosine: 0.5
    pagerank: 0.2
    heading: 0.2
    position: 0.1

  # ハイブリッド検索時の合算係数
  hybrid_weights:
    vector: 0.7 # ベクトルスコア（上記 weights の合算値）
    bm25: 0.3 # BM25スコア

# 見出しレベルごとの重み
heading_weights:
  1: 9.0
  2: 6.0
  3: 3.0
  4: 2.0
  5: 1.5
  6: 1.0
